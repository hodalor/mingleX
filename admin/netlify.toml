# Netlify site base directory: admin
# Set VITE_API_URL in the Netlify site environment to the Cloud Run URL before the production build.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://minglex-31319355631.europe-west9.run.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
